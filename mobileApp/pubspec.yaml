name: marsa_mobile
version: 1.0.0+1
publish_to: none
description: Marsa Mobile App - Offline-first installment management
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Theming
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  animations: ^2.0.11
  flutter_animate: ^4.5.0

  # State Management
  flutter_bloc: ^8.1.6
  provider: ^6.1.2
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Local Storage (Offline)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Networking & API
  dio: ^5.7.1
  retrofit: ^4.4.1
  json_annotation: ^4.9.0
  connectivity_plus: ^6.1.0

  # Supabase
  supabase_flutter: ^2.6.0

  # Authentication & Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  image_cropper: ^8.0.2
  photo_view: ^0.15.0

  # Printing & Sharing
  share_plus: ^10.0.2
  url_launcher: ^6.3.1
  # flutter_bluetooth_serial: ^0.4.0  # TODO: Add later with compatible version

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.4.0
  uuid: ^4.5.1
  collection: ^1.18.0

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # QR/Barcode
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  retrofit_generator: ^8.2.1
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/marsa_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0A192F"
  image: assets/images/marsa_logo.png
  android: true
  ios: true
  web: false
  android_12:
    image: assets/images/marsa_logo.png
    color: "#0A192F"
