name: marsa_app
description: Marsa Mobile App - Offline-first installment management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  dio: ^5.7.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1
  printing: ^5.14.0
  pdf: ^3.12.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.5.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
